<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
  <title>Tessera</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app" data-screen="welcome">
    <header class="toolbar" id="toolbar">
      <div class="toolbar-leading">
        <button class="tool-button" id="back" data-i18n-tip="tipBack">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10.25 3.25 5.5 8l4.75 4.75"/></svg>
        </button>
        <nav class="crumbs" id="crumbs" aria-label="Path"></nav>
      </div>
      <div class="toolbar-trailing">
        <div class="status" id="status" aria-live="polite"></div>
        <button class="tool-button" id="rescan" data-i18n-tip="tipRescan">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.1 8.6a5.15 5.15 0 1 1-1.52-4.24"/><path d="M12.1 1.9v2.8H9.3"/></svg>
        </button>
        <button class="tool-button" id="locations" data-i18n-tip="tipLocations">
          <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2.25" y="2.25" width="4.75" height="4.75" rx="1.3"/><rect x="9" y="2.25" width="4.75" height="4.75" rx="1.3"/><rect x="2.25" y="9" width="4.75" height="4.75" rx="1.3"/><rect x="9" y="9" width="4.75" height="4.75" rx="1.3"/></svg>
        </button>
      </div>
    </header>

    <section class="welcome" id="welcome" aria-label="Locations">
      <div class="welcome-inner">
        <div class="mark" id="mark" aria-hidden="true"></div>
        <h1 class="reveal" style="--i: 2">Tessera</h1>
        <p class="tagline reveal" style="--i: 3" data-i18n="tagline">See what’s taking up space.</p>
        <div class="location-list" id="location-list"></div>
        <p class="drop-hint reveal" style="--i: 9" data-i18n="dropHint">You can also drop any folder onto this window.</p>
      </div>
    </section>

    <section class="explorer" id="explorer" aria-label="Disk map">
      <div class="stage" id="stage">
        <canvas id="map" role="img" data-i18n-label="mapLabel"></canvas>
        <div class="stage-message" id="stage-message"></div>
      </div>
      <footer class="infobar">
        <div class="readout" id="readout"></div>
        <div class="legend" id="legend" role="group" aria-label="Kinds"></div>
      </footer>
    </section>

    <div class="toast" id="toast" role="status"></div>
    <div class="drop-target" id="drop-target" aria-hidden="true">
      <div class="drop-card">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4.5v11"/><path d="m7.5 11 4.5 4.5 4.5-4.5"/><path d="M4.5 18.5h15"/></svg>
        <span data-i18n="dropCard">Drop a folder to see inside it</span>
      </div>
    </div>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
